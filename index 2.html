<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جولات التفتيش</title>
<meta name="theme-color" content="#0E5B60">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="جولات التفتيش">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFEE; --surface:#FFFFFF; --surface2:#F5F7F6; --ink:#15232A; --muted:#5A6A70; --line:#D2D9DA;
  --accent:#0E5B60; --accent-ink:#FFFFFF; --accent-soft:#DCEBEA;
  --ok:#2E7A4E; --obs:#9A6B12; --minor:#C2410C; --major:#B3261E;
  --hole:#ECEFEE;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F171A; --surface:#172327; --surface2:#1C2A2F; --ink:#E4ECED; --muted:#93A4A8; --line:#2B3B40;
    --accent:#58B7B2; --accent-ink:#0B1A1C; --accent-soft:#1D3538;
    --ok:#5DBB82; --obs:#D9A441; --minor:#F0874F; --major:#F2685F;
    --hole:#0F171A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F171A; --surface:#172327; --surface2:#1C2A2F; --ink:#E4ECED; --muted:#93A4A8; --line:#2B3B40;
  --accent:#58B7B2; --accent-ink:#0B1A1C; --accent-soft:#1D3538;
  --ok:#5DBB82; --obs:#D9A441; --minor:#F0874F; --major:#F2685F;
  --hole:#0F171A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"DejaVu Sans",sans-serif;font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.thumbs img,.ph img{display:block}

.wrap{max-width:672px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 132px max(16px,env(safe-area-inset-left,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));max-width:672px;margin:0 auto}
.top h1{font-size:19px;font-weight:700;margin:0;flex:1;line-height:1.3}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

.hero{padding:8px 0 18px}
.hero .kind{font-size:15px;color:var(--muted);font-weight:500}
.hero .date{font-size:30px;font-weight:700;line-height:1.25;letter-spacing:-.2px}
.hero .meta{color:var(--muted);font-size:14px;margin-top:4px}

.sec{font-size:14px;color:var(--muted);font-weight:600;margin:22px 0 10px}
.list{display:flex;flex-direction:column;gap:10px}

/* cutting-board rows */
.board{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:74px;width:100%;text-align:right;padding:0;color:inherit}
.board .band{width:30px;flex:none;background:var(--z,#475569);position:relative}
.board .band.light{box-shadow:inset -1px 0 0 var(--line)}
.board .band::after{content:"";position:absolute;top:12px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--hole);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.board .body{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.board .name{font-weight:600;font-size:17px;line-height:1.35}
.board .sub{font-size:13px;color:var(--muted)}
.board .chev{align-self:center;padding-inline-end:12px;color:var(--muted)}
.board .chev svg{width:18px;height:18px}

.round{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%;text-align:right;color:inherit}
.round .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.round .t{font-weight:600}
.round .d{color:var(--muted);font-size:14px}
.round .state{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.round .state.done{background:var(--surface2);color:var(--muted)}

.counts{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.counts span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.obs{background:var(--obs)}.dot.minor{background:var(--minor)}.dot.major{background:var(--major)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;border:1.5px solid currentColor;line-height:1.4}
.pill.ok{color:var(--ok)}.pill.obs{color:var(--obs)}.pill.minor{color:var(--minor)}.pill.major{color:var(--major)}

.ocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%;text-align:right;color:inherit;display:flex;flex-direction:column;gap:8px}
.ocard .txt{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ocard .act{font-size:14px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.ocard .act b{color:var(--ink);font-weight:600}
.ocard .time{font-size:12px;color:var(--muted)}
.thumbs{display:flex;gap:8px;overflow-x:auto}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--surface2);flex:none}

.addbig{width:100%;border:2px dashed var(--line);border-radius:16px;background:transparent;padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:18px}
.addbig svg{width:34px;height:34px}
.addbig small{color:var(--muted);font-weight:400;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-weight:500}
.chip .dot{width:12px;height:12px;border-radius:50%}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 14px}
.tabs button{min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 0 10px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.chip{flex:none}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip .okm{color:var(--ok);font-weight:700}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.item .q{font-weight:600;line-height:1.55;margin-bottom:10px}
.item .q small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.vals{display:flex;flex-wrap:wrap;gap:6px}
.val{min-height:42px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);font-weight:600;font-size:14px}
.val[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.val[aria-pressed="true"].off{border-color:var(--obs);color:var(--obs);background:var(--surface);box-shadow:inset 0 0 0 1px var(--obs)}
.ref{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:26px;padding:0 8px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;flex:none}
.atxt{font-size:13.5px;color:var(--ink);font-weight:600}
.progress{display:block;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:16px}
.card h3{margin:0 0 10px;font-size:15px}
.srow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.srow .input{min-height:44px;padding:8px 12px}
.srow .grow{flex:1;min-width:0}
.srow .small{width:64px;flex:none;text-align:center}
.srow select.input{width:auto;flex:none;min-width:130px}
.sblock{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.sblock .iconbtn{border:0;background:transparent;color:var(--muted)}
.seg.two{grid-template-columns:1fr 1fr}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 0 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:48px;min-height:58px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 0;line-height:1.2}
.day b{font-size:16px}
.day small{font-size:11px;color:var(--muted)}
.day i{width:6px;height:6px;border-radius:50%;background:transparent;margin-top:2px}
.day.full i{background:var(--ok)}.day.part i{background:var(--obs)}.day.bad i{background:var(--major)}
.day.today{border-color:var(--muted)}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.crow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.crow .l{display:flex;align-items:center;gap:10px}
.crow .t{flex:1;min-width:0;font-weight:600;line-height:1.45}
.mk{width:50px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);display:grid;place-items:center;flex:none;font-size:20px;font-weight:700;color:var(--muted)}
.mk.okb[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.mk.badb[aria-pressed="true"]{background:var(--major);border-color:var(--major);color:#fff}
.crow .nb{background:none;border:0;color:var(--accent);font-size:13px;font-weight:600;padding:6px 0 0;min-height:32px}
.crow input.input{margin-top:8px;min-height:42px;padding:8px 12px;font-size:15px}
.itemnote{background:none;border:0;color:var(--accent);font-weight:600;font-size:13.5px;padding:8px 0 0;min-height:36px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--major)}
.btn.grow{flex:1}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:10px 0;min-height:44px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(8,16,18,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.full{height:100%;max-height:100%;border-radius:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.sheet h2{font-size:19px;margin:0 0 14px}
.sheet .head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet .head h2{flex:1;margin:0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.flabel{font-size:14px;font-weight:600;color:var(--muted)}
.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:50px;width:100%}
textarea.input{min-height:120px;resize:vertical;line-height:1.7}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;padding:6px 10px;line-height:1.35}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.lv .opt{display:flex;align-items:center;gap:8px;text-align:right}
.lv .opt[aria-pressed="true"].ok{border-color:var(--ok);color:var(--ok);background:var(--surface)}
.lv .opt[aria-pressed="true"].obs{border-color:var(--obs);color:var(--obs);background:var(--surface)}
.lv .opt[aria-pressed="true"].minor{border-color:var(--minor);color:var(--minor);background:var(--surface)}
.lv .opt[aria-pressed="true"].major{border-color:var(--major);color:var(--major);background:var(--surface)}
.lv .opt[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px currentColor}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .x{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.ph .x svg{width:16px;height:16px}
.ph.loading{display:grid;place-items:center;color:var(--muted);font-size:13px}
.addph{display:flex;gap:8px;margin-top:8px}
.addph label{flex:1}
.addph input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.zrow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.zrow .sw{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);flex:none}
.zrow input{flex:1;min-width:0;border:0;background:transparent;padding:8px 4px;min-height:40px}
.zrow .iconbtn{width:40px;height:40px;border:0;background:transparent;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
.swatches button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line)}
.swatches button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}

.exp{display:flex;flex-direction:column;gap:10px}
.exp .btn{justify-content:flex-start;padding:0 16px;min-height:62px;text-align:right}
.exp .btn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.exp .badge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none;letter-spacing:.3px}

.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:88%;text-align:center}
.loader{padding:80px 0;text-align:center;color:var(--muted)}
.busy{position:fixed;inset:0;background:rgba(8,16,18,.5);z-index:30;display:grid;place-items:center;color:#fff;font-weight:600;padding:20px;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div id="app"><div class="loader">جارٍ التحميل…</div></div>
<div id="layer"></div>
<div id="layer2"></div>

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
const TYPES={checklist:"التفتيش اليومي",weekly:"تفتيش أسبوعي",monthly:"تفتيش شهري",report:"التقرير الشهري",daily:"تفتيش يومي (قديم)"};
const NEW_TYPES=["checklist","weekly","monthly","report"];
function defaultChecklist(inspector){
  return{items:["نظافة الأرضية","نظافة الجدران","نظافة السقف","نظافة الأسطح وطاولات التحضير","نظافة المعدات والأدوات","درجة حرارة الثلاجات ضمن الحد المسموح","درجة حرارة الفريزرات ضمن الحد المسموح","تغطية الأطعمة وتخزينها بشكل صحيح","ملصقات التاريخ والصلاحية","النظافة الشخصية للعاملين (غطاء الرأس، القفازات، الزي)","التخلص من النفايات وإغلاق الحاويات","عدم وجود حشرات أو آثار قوارض"].map(text=>({id:uid(),text})),
    signers:[{id:uid(),role:"توقيع المشرف",name:""},{id:uid(),role:"توقيع الأخصائي",name:inspector||""}]};
}
const VALS=[{k:"yes",label:"نعم"},{k:"no",label:"لا"},{k:"none",label:"لا يوجد"},{k:"maint",label:"تحتاج صيانة"},{k:"na",label:"لا تحتاجها المنطقة"}];
const VL=Object.fromEntries(VALS.map(v=>[v.k,v]));
function defaultReport(inspector){
  const A=n=>n.map(x=>({id:uid(),name:x}));
  return{org:"إدارة خدمات الطعام",title:"التقرير الشهري",
    sections:[
      {id:uid(),name:"المطبخ",prefix:"م",color:"#C2410C",areas:A(["المطبخ الساخن","مطبخ الحمية","السلطة","الجزارة","الحلواني","السندويتشات","الغسيل الآلي والتنظيف"])},
      {id:uid(),name:"المستودعات",prefix:"س",color:"#1565C0",areas:A(["مستودع المواد الغذائية الجاف","الثلاجات","الفريزرات","مستودع البلاستيك","مستودع المواد الكيميائية","غرف طعام الموظفين","غرف استراحة الموظفات"])},
      {id:uid(),name:"الكافيتريا ومكتب المحاسب",prefix:"ك",color:"#6D28D9",areas:A(["كافيتريا النساء","كافيتريا الرجال"])}
    ],
    items:[["هل يوجد فتحات بالسقف والجدران والأرضية؟","no"],["هل فتحات التصريف محكمة الإغلاق؟","yes"],["هل يوجد آثار عض القوارض؟","no"],["هل توجد فضلات للقوارض؟","no"],["ما مدى فعالية مصائد الحشرات والقوارض؟","yes"],["ما مدى فعالية الستائر الهوائية؟","yes"],["هل تم تغطية المنطقة من قبل الشركة المسؤولة عن الرش ومكافحة الحشرات والقوارض؟","yes"]].map(([text,good])=>({id:uid(),text,good})),
    signers:[{id:uid(),role:"توقيع مساعد مدير الإدارة",name:""},{id:uid(),role:"توقيع مدير الموقع",name:""},{id:uid(),role:"توقيع الأخصائي",name:inspector||""}]
  };
}
const LEVELS=[
  {k:"ok",label:"مطابق",short:"مطابق"},
  {k:"obs",label:"ملاحظة",short:"ملاحظة"},
  {k:"minor",label:"عدم مطابقة بسيطة",short:"بسيطة"},
  {k:"major",label:"عدم مطابقة كبرى",short:"كبرى"}
];

/* ---------- local storage (IndexedDB, with in-memory fallback) ---------- */
const LocalDB=(function(){
  let p=null;const mem={kv:new Map(),rounds:new Map(),photos:new Map()};let useMem=false;
  function open(){
    if(p)return p;
    p=new Promise(res=>{
      try{
        const r=indexedDB.open("kitchen-rounds",1);
        r.onupgradeneeded=()=>{const d=r.result;["kv","rounds","photos"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};
        r.onsuccess=()=>res(r.result);
        r.onerror=()=>{useMem=true;res(null)};
        r.onblocked=()=>{useMem=true;res(null)};
      }catch(e){useMem=true;res(null)}
    });
    return p;
  }
  async function run(store,mode,fn,memFn){
    const d=await open();
    if(!d||useMem)return memFn(mem[store]);
    return new Promise((res,rej)=>{
      try{
        const t=d.transaction(store,mode);const s=t.objectStore(store);let out;const r=fn(s);
        if(r)r.onsuccess=()=>{out=r.result};
        t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
      }catch(e){rej(e)}
    });
  }
  return{
    get:(st,k)=>run(st,"readonly",s=>s.get(k),m=>m.get(k)),
    put:(st,k,v)=>run(st,"readwrite",s=>s.put(v,k),m=>{m.set(k,v)}),
    del:(st,k)=>run(st,"readwrite",s=>s.delete(k),m=>{m.delete(k)}),
    all:st=>run(st,"readonly",s=>s.getAll(),m=>Array.from(m.values())),
    isMem:async()=>{await open();return useMem}
  };
})();

const urlCache=new Map();
function blobToDataURL(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b)})}
// photos are kept on this device as data-URL strings (more reliable than Blobs in phone web views)
async function localPhoto(blob){
  const id="l_"+uid();const d=await blobToDataURL(blob);
  await LocalDB.put("photos",id,d);
  const back=await LocalDB.get("photos",id);if(!back)throw new Error("photo-not-saved");
  urlCache.set(id,d);return id;
}
async function localPhotoDel(id){await LocalDB.del("photos",id);urlCache.delete(id)}
async function photoURL(id){
  if(!id.startsWith("l_"))return "/_blob/"+id;
  if(urlCache.has(id))return urlCache.get(id);
  const v=await LocalDB.get("photos",id);if(!v)return "";
  const u=typeof v==="string"?v:await blobToDataURL(v);urlCache.set(id,u);return u;
}
async function hydrate(root){
  for(const im of $$("img[data-pid]",root||document)){
    if(im.dataset.done)continue;im.dataset.done="1";
    photoURL(im.dataset.pid).then(u=>{if(u)im.src=u}).catch(()=>{});
  }
}

function makeLocalStore(){
  return{
    mode:"local",
    async load(){const settings=await LocalDB.get("kv","settings");const rounds=await LocalDB.all("rounds");return{settings:settings||null,rounds:rounds||[]}},
    saveSettings:s=>LocalDB.put("kv","settings",clone(s)),
    saveRound:r=>LocalDB.put("rounds",r.id,clone(r)),
    deleteRound:id=>LocalDB.del("rounds",id),
    uploadPhoto:blob=>localPhoto(blob),
    deletePhoto:id=>localPhotoDel(id)
  };
}
function makeRemoteStore(db,userId,assets){
  const base="data/users/"+userId;
  const setRef=db.doc(base+"/settings");
  const col=db.doc(base+"/app").collection("rounds");
  const q=new Map();
  const serial=(key,fn)=>{const prev=q.get(key)||Promise.resolve();const next=prev.catch(()=>{}).then(fn);q.set(key,next);return next};
  return{
    mode:"remote",
    async load(){
      const [s,list]=await Promise.all([setRef.get(),col.limit(1000).get()]);
      return{settings:s.exists?clone(s.data()):null,rounds:list.docs.map(d=>clone(d.data()))};
    },
    saveSettings:s=>{const c=clone(s);return serial("settings",()=>setRef.set(c))},
    saveRound:r=>{const c=clone(r);return serial(r.id,()=>col.doc(r.id).set(c))},
    deleteRound:id=>serial(id,()=>col.doc(id).delete()),
    uploadPhoto:blob=>localPhoto(blob), // photos never leave this device
    async deletePhoto(id){
      if(id.startsWith("l_"))return localPhotoDel(id);
      if(assets){try{await assets.delete(id)}catch(e){console.warn("delete asset",e)}}
    }
  };
}
async function pickStore(){
  const c=window.claude;
  if(c&&typeof c.use==="function"){
    try{
      const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
      if(db&&user){
        const id=await user.id();
        if(id){const assets=await c.use("assets").catch(()=>null);return makeRemoteStore(db,id,assets)}
      }
    }catch(e){console.warn("store",e)}
  }
  return makeLocalStore();
}

function isReport(r){return !!r&&r.type==="report"}
function isChecklist(r){return !!r&&r.type==="checklist"}
function daysIn(month){const [y,m]=month.split("-").map(Number);return new Date(y,m,0).getDate()}
function monthLabel(month){try{const [y,m]=month.split("-").map(Number);return new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn",{month:"long",year:"numeric"}).format(new Date(y,m-1,1))}catch(e){return month}}
function dayLabel(month,d){try{const [y,m]=month.split("-").map(Number);return new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn",{weekday:"short"}).format(new Date(y,m-1,d))}catch(e){return ""}}
function cMark(r,zid,d,iid){return (((r.days||{})[zid]||{})[d]||{})[iid]||null}
function cDay(r,zid,d){const z=(r.days[zid]=r.days[zid]||{});return (z[d]=z[d]||{})}
function dayState(r,zid,d){let ok=0,bad=0;for(const it of r.items){const m=cMark(r,zid,d,it.id);if(m&&m.v==="ok")ok++;else if(m&&m.v==="bad")bad++}const n=r.items.length;return{ok,bad,done:ok+bad,n,full:n>0&&ok+bad===n}}
function clDaysDone(r,zid){let k=0;const N=daysIn(r.month);for(let d=1;d<=N;d++)if(dayState(r,zid,d).full)k++;return k}
function allNotes(r){const out=[];if(isChecklist(r))return out;if(isReport(r)){for(const s of r.sections)for(const n of (r.notes[s.id]||[]))out.push(n)}else{for(const z of (r.zones||[]))for(const o of ((r.obs||{})[z.id]||[]))out.push(o)}return out}
function roundCounts(r){const c={ok:0,obs:0,minor:0,major:0,total:0};for(const o of allNotes(r)){c[o.level]=(c[o.level]||0)+1;c.total++}return c}
function cellVal(r,sid,aid,iid){return ((r.checks[sid]||{})[aid]||{})[iid]||""}
function setCell(r,sid,aid,iid,v){const a=(r.checks[sid]=r.checks[sid]||{});const b=(a[aid]=a[aid]||{});if(v)b[iid]=v;else delete b[iid]}
function checkProgress(r,sid){let done=0,total=0;for(const sec of r.sections){if(sid&&sec.id!==sid)continue;for(const a of sec.areas)for(const it of r.items){total++;if(cellVal(r,sec.id,a.id,it.id))done++}}return{done,total}}
function refOf(sec,idx){return (sec.prefix||sec.name.slice(0,1))+"-"+(idx+1)}
function areaNames(sec,ids){return (ids||[]).map(id=>(sec.areas.find(a=>a.id===id)||{}).name).filter(Boolean).join("، ")}
function getPath(o,path){if(!path)return o;return path.split(".").reduce((x,k)=>x==null?x:x[k],o)}
function setPath(o,path,v){const ks=path.split(".");const last=ks.pop();const t=getPath(o,ks.join("."));if(t)t[last]=v}
function zoneCounts(r,zid){const c={ok:0,obs:0,minor:0,major:0,total:0};for(const o of (r.obs[zid]||[])){c[o.level]++;c.total++}return c}
function countsHTML(c,empty){
  if(!c.total)return '<div class="counts"><span>'+esc(empty||"لا توجد ملاحظات بعد")+'</span></div>';
  return '<div class="counts">'+LEVELS.filter(l=>c[l.k]).map(l=>'<span><i class="dot '+l.k+'"></i>'+esc(l.short)+" "+c[l.k]+"</span>").join("")+"</div>";
}
function normRound(r){r.obs=r.obs||{};r.zones=r.zones||[];if(r.type==="checklist"){r.items=r.items||[];r.days=r.days||{};r.month=r.month||(r.date||todayISO()).slice(0,7);
    if(!r.zones.length&&(r.area||Object.keys(r.days).some(k=>/^\d+$/.test(k)))){const z={id:uid(),name:r.area||"عام",color:PALETTE[1]};r.zones=[z];const old={};for(const k of Object.keys(r.days))if(/^\d+$/.test(k)){old[k]=r.days[k];delete r.days[k]}r.days[z.id]=old;delete r.area}}if(r.type==="report"){r.sections=r.sections||[];r.items=r.items||[];r.signers=r.signers||[];r.checks=r.checks||{};r.notes=r.notes||{}}}
function sortedRounds(){return Object.values(S.rounds).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt-a.createdAt))}

/* ---------- navigation ---------- */
function go(view){S.view=view;render();window.scrollTo(0,0);if(view.name==="czone")centerDay()}
function centerDay(){const b=$(".day[aria-pressed=true]");if(b&&b.scrollIntoView)b.scrollIntoView({inline:"center",block:"nearest"})}
function render(){
  const v=S.view;const app=$("#app");
  if(v.name==="round"&&!S.rounds[v.id])S.view={name:"home"};
  if(v.name==="zone"&&(!S.rounds[v.id]||!S.rounds[v.id].zones.find(z=>z.id===v.zoneId)))S.view=S.rounds[v.id]?{name:"round",id:v.id}:{name:"home"};
  if(v.name==="czone"){const r=S.rounds[v.id];if(!isChecklist(r)||!r.zones.find(z=>z.id===v.zoneId))S.view=r?{name:"round",id:v.id}:{name:"home"}}
  if(v.name==="section"){const r=S.rounds[v.id];if(!isReport(r)||!r.sections.find(x=>x.id===v.sid))S.view=r?{name:"round",id:v.id}:{name:"home"}}
  const name=S.view.name;
  app.innerHTML=name==="home"?viewHome():name==="round"?(isReport(S.rounds[S.view.id])?viewReport():isChecklist(S.rounds[S.view.id])?viewChecklist():viewRound()):name==="zone"?viewZone():name==="section"?viewSection():name==="czone"?viewCZone():name==="rsettings"?viewReportSettings():name==="csettings"?viewChecklistSettings():viewSettings();
  hydrate(app);
}

function sheetManageItems(){

      '<p class="note">البنود نفسها لكل مناطق هذا الشهر. حذف بند يحذف علاماته من كل الأيام. وتغيير البنود الافتراضية للشهور الجاية من الإعدادات.</p>',{full:true});

    $$("[data-mdel]",sh).forEach(b=>b.onclick=async()=>{const it=r.items[+b.dataset.mdel];const ok=await confirmSheet("حذف بند \""+it.text+"\" وعلاماته؟","احذف",true);if(!ok)return;r.items.splice(+b.dataset.mdel,1);for(const zk in r.days)for(const k in r.days[zk])delete r.days[zk][k][it.id];saveRound(r);draw()});

  };
  draw();
}

function openSheet(html,opts){
  opts=opts||{};
  const layer=$("#layer");
  layer.innerHTML='<div class="scrim" data-scrim><div class="sheet'+(opts.full?" full":"")+'" role="dialog" aria-modal="true">'+html+"</div></div>";
  const sh=$(".sheet",layer);
  $(".scrim",layer).addEventListener("click",e=>{if(e.target.hasAttribute("data-scrim")&&!opts.full)closeSheet()});
  document.body.style.overflow="hidden";
  hydrate(sh);
  return sh;
}
function closeSheet(){$("#layer").innerHTML="";document.body.style.overflow="";}
function confirmSheet(msg,okLabel,danger){
  return new Promise(res=>{
    const L=$("#layer2");
    L.innerHTML='<div class="scrim" style="z-index:28"><div class="sheet" role="alertdialog" aria-modal="true"><h2>'+esc(msg)+'</h2><div style="display:flex;gap:10px"><button class="btn grow '+(danger?"danger":"primary")+'" data-yes>'+esc(okLabel)+'</button><button class="btn grow" data-no>إلغاء</button></div></div></div>';
    document.body.style.overflow="hidden";
    const done=v=>{L.innerHTML="";if(!$("#layer").innerHTML)document.body.style.overflow="";res(v)};
    $("[data-yes]",L).onclick=()=>done(true);$("[data-no]",L).onclick=()=>done(false);
  });
}

function sheetAddZoneToRound(){
  const r=S.rounds[S.view.id];
  const have=new Set(r.zones.map(z=>z.name.trim()));
  const sugg=S.settings.zones.filter(z=>!have.has(z.name.trim()));
  const sh=openSheet('<h2>إضافة منطقة</h2><div class="field"><label for="f-nz">اسم المنطقة</label><input class="input" id="f-nz" placeholder="مثال: المطبخ الحار" enterkeyhint="done" autocomplete="off"></div>'+
    '<button class="btn primary" style="width:100%" data-new>'+I.plus+"أضف وافتح المنطقة</button>"+
    (sugg.length?'<div class="sec">أو اختر من مناطقك السابقة</div><div class="chips">'+sugg.map(z=>'<button class="chip" data-add="'+z.id+'"><i class="dot" style="background:'+esc(z.color)+'"></i>'+esc(z.name)+"</button>").join("")+"</div>":""));
  const inp=$("#f-nz",sh);
  const addZone=z=>{const c=clone(z);c.id=uid();r.zones.push(c);saveRound(r);closeSheet();go({name:isChecklist(r)?"czone":"zone",id:r.id,zoneId:c.id})};
  $$("[data-add]",sh).forEach(b=>b.onclick=()=>addZone(S.settings.zones.find(x=>x.id===b.dataset.add)));
  const submit=()=>{
    const name=inp.value.trim();
    if(!name){toast("اكتب اسم المنطقة");inp.focus();return}
    const dup=r.zones.find(z=>z.name.trim()===name);
    if(dup){closeSheet();go({name:isChecklist(r)?"czone":"zone",id:r.id,zoneId:dup.id});return}
    let z=S.settings.zones.find(x=>x.name.trim()===name);
    if(!z){
      const inRound=new Set(r.zones.map(x=>x.color)),saved=new Set(S.settings.zones.map(x=>x.color));
      const free=PALETTE.filter(c=>!inRound.has(c));

      S.settings.zones.push(z);saveSettings();

  };

  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit()}});
  setTimeout(()=>inp.focus(),60);

function sheetObs(existing,prefill){
  const ctx=obsCtx();const r=ctx.r;
  const draft=existing?clone(existing):{id:uid(),level:"obs",text:"",action:"",photos:[],at:Date.now()};
  if(ctx.areas&&!draft.areas)draft.areas=existing?[]:(ctx.defAreas||[]).slice();

  const startAreas=JSON.stringify(draft.areas||[]);

  const areaHTML=ctx.areas?'<div class="field"><span class="flabel">المنطقة (تقدر تختار أكثر من وحدة)</span><div class="chips">'+ctx.areas.map(a=>'<button class="chip" data-area="'+a.id+'" aria-pressed="'+draft.areas.includes(a.id)+'">'+esc(a.name)+"</button>").join("")+"</div></div>":"";
  const sh=openSheet(
    '<div class="head"><button class="iconbtn" data-close aria-label="إغلاق">'+I.x+'</button><h2>'+(existing?"تعديل الملاحظة":"ملاحظة جديدة")+'</h2></div>'+
    '<div class="counts" style="margin:-4px 0 14px">'+esc(ctx.subtitle)+"</div>"+
    '<div class="field"><label for="f-txt">الملاحظة</label><textarea class="input" id="f-txt" placeholder="صف ما لاحظته">'+esc(draft.text)+"</textarea></div>"+
    '<div class="field"><span class="flabel">الصور (تنحفظ في جوالك فقط)</span><div class="photos" data-photos></div>'+
    '<div class="addph"><label class="btn">'+I.cam+'تصوير<input type="file" accept="image/*" capture="environment" data-file></label><label class="btn">'+I.img+'من الصور<input type="file" accept="image/*" multiple data-file></label></div></div>'+
    areaHTML+
    '<div class="field"><span class="flabel">التصنيف</span><div class="lv">'+LEVELS.map(l=>'<button class="opt '+l.k+'" data-lv="'+l.k+'" aria-pressed="'+(draft.level===l.k)+'"><i class="dot '+l.k+'"></i>'+esc(l.label)+"</button>").join("")+"</div></div>"+
    '<div class="field"><label for="f-act">الإجراء التصحيحي (اختياري)</label><textarea class="input" id="f-act" style="min-height:84px" placeholder="مثال: تم التخلص من المنتج وإبلاغ المشرف">'+esc(draft.action)+"</textarea></div>"+
    '<div style="display:flex;gap:10px"><button class="btn primary grow" data-save>حفظ الملاحظة</button>'+(existing?'<button class="btn danger" data-del aria-label="حذف الملاحظة">'+I.trash+"</button>":"")+"</div>",
    {full:true});
  const box=$("[data-photos]",sh);
  function drawPhotos(){
    box.innerHTML=draft.photos.map((p,i)=>'<div class="ph"><img alt="صورة '+(i+1)+'" data-pid="'+esc(p.id)+'"><button class="x" data-rm="'+i+'" aria-label="إزالة الصورة">'+I.x+"</button></div>").join("")+
      Array.from({length:pending}).map(()=>'<div class="ph loading">جارٍ الحفظ…</div>').join("");
    box.style.display=(draft.photos.length||pending)?"grid":"none";
    hydrate(box);
    $$("[data-rm]",box).forEach(b=>b.onclick=()=>{const [p]=draft.photos.splice(+b.dataset.rm,1);removed.push(p.id);drawPhotos()});
  }
  drawPhotos();
  $$("[data-file]",sh).forEach(inp=>inp.onchange=async()=>{
    const files=Array.from(inp.files||[]);inp.value="";
    for(const f of files){
      pending++;drawPhotos();
      try{const c=await compress(f);const id=await S.store.uploadPhoto(c.blob);added.push(id);draft.photos.push({id,w:c.w,h:c.h})}
      catch(e){console.warn(e);toast("تعذر حفظ الصورة في الجوال")}
      pending--;drawPhotos();
    }
  });
  $$("[data-area]",sh).forEach(b=>b.onclick=()=>{const id=b.dataset.area;const k=draft.areas.indexOf(id);if(k>=0)draft.areas.splice(k,1);else draft.areas.push(id);b.setAttribute("aria-pressed",k<0)});
  $$("[data-lv]",sh).forEach(b=>b.onclick=()=>{draft.level=b.dataset.lv;$$("[data-lv]",sh).forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("[data-close]",sh).onclick=async()=>{
    const dirty=added.length||removed.length||$("#f-txt",sh).value!==(existing?existing.text:"")||$("#f-act",sh).value!==(existing?existing.action:"")||JSON.stringify(draft.areas||[])!==startAreas;
    if(dirty){const ok=await confirmSheet("تجاهل التغييرات على هذه الملاحظة؟","تجاهل",true);if(!ok)return}
    added.forEach(id=>S.store.deletePhoto(id));closeSheet();
  };
  $("[data-save]",sh).onclick=()=>{
    if(pending){toast("انتظر حتى تنحفظ الصور");return}
    draft.text=$("#f-txt",sh).value.trim();draft.action=$("#f-act",sh).value.trim();
    if(!draft.text&&!draft.photos.length){toast("اكتب الملاحظة أو أضف صورة");return}
    if(ctx.areas&&!draft.areas.length){toast("اختر المنطقة");return}
    const arr=ctx.list();
    const i=arr.findIndex(o=>o.id===draft.id);if(i>=0)arr[i]=draft;else arr.push(draft);
    removed.forEach(id=>S.store.deletePhoto(id));
    saveRound(r);closeSheet();render();toast("حُفظت الملاحظة");
  };
  const del=$("[data-del]",sh);
  if(del)del.onclick=async()=>{
    const ok=await confirmSheet("حذف هذه الملاحظة وصورها؟","احذف",true);if(!ok)return;
    ctx.setList(ctx.list().filter(o=>o.id!==existing.id));
    [...existing.photos.map(p=>p.id),...added].forEach(id=>S.store.deletePhoto(id));
    saveRound(r);closeSheet();render();toast("حُذفت الملاحظة");
  };
}

/* ---------- photos ---------- */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>res({im,u});im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};im.src=u})}
async function compress(file){
  const MAX=1600;
  const {im,u}=await loadImg(file);
  let w=im.naturalWidth,h=im.naturalHeight;const s=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;const ctx=cv.getContext("2d");
  ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
  const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.82));
  if(!blob)throw new Error("encode");
  return{blob,w,h};
}

/* ---------- export ---------- */
const loaded={};
function loadScript(src){
  if(loaded[src])return loaded[src];
  loaded[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{delete loaded[src];rej(new Error("load "+src))};document.head.appendChild(s)});
  return loaded[src];
}
function fileBase(r){return (TYPES[r.type]||"جولة")+" "+r.date}
function flat(r){
  const out=[];
  for(const z of r.zones)for(const o of (r.obs[z.id]||[]))out.push({zone:z,o});
  return out;
}
async function photoBytes(id){
  const u=await photoURL(id);if(!u)return null;
  const im=await new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=u});if(!im)return null;
  const MAX=900;const s=Math.min(1,MAX/Math.max(im.naturalWidth,im.naturalHeight));
  const cv=document.createElement("canvas");cv.width=Math.round(im.naturalWidth*s);cv.height=Math.round(im.naturalHeight*s);
  cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
  const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.68));if(!b)return null;
  return new Uint8Array(await b.arrayBuffer());
}

async function saveFile(name,blob){
  const c=window.claude;let dl=null;
  if(c&&typeof c.use==="function"){try{dl=await c.use("downloads")}catch(e){dl=null}}
  if(dl){
    try{await dl.save({filename:name,data:blob});toast("جاهز: "+name)}
    catch(e){if(e&&e.code==="declined")return;console.warn(e);toast("تعذر حفظ الملف")}
    return;
  }
  // phone app: offer the file through the share sheet (email, WhatsApp, Files) on a fresh tap
  const file=new File([blob],name,{type:blob.type||"application/octet-stream"});
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  const sh=openSheet('<h2>الملف جاهز</h2><p class="note" style="margin:-6px 0 14px">'+esc(name)+" ("+Math.max(1,Math.round(blob.size/1024))+" ك.ب)</p>"+
    (canShare?'<button class="btn primary" style="width:100%;margin-bottom:10px" data-share>'+I.share+"مشاركة أو حفظ في الملفات</button>":"")+
    '<button class="btn" style="width:100%;margin-bottom:10px" data-dl>تنزيل الملف</button><button class="btn" style="width:100%" data-no>إغلاق</button>');
  const s1=$("[data-share]",sh);
  if(s1)s1.onclick=async()=>{try{await navigator.share({files:[file],title:name});closeSheet()}catch(e){if(!e||e.name!=="AbortError")toast("تعذرت المشاركة، جرّب التنزيل")}};
  $("[data-dl]",sh).onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},10000);closeSheet()};
  $("[data-no]",sh).onclick=closeSheet;
}

/* ---------- backup / restore (everything lives on this phone) ---------- */
async function backup(){
  busy(true,"جارٍ تجهيز النسخة…");
  try{
    const photos={};
    for(const r of Object.values(S.rounds))for(const o of allNotes(r))for(const p of (o.photos||[])){
      if(p.id.startsWith("l_")){const u=await photoURL(p.id);if(u)photos[p.id]=u}
    }
    const data={app:"kitchen-rounds",version:1,savedAt:Date.now(),settings:S.settings,rounds:Object.values(S.rounds),photos};
    const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    busy(false);
    await saveFile("نسخة احتياطية جولات التفتيش "+todayISO()+".json",blob);
  }catch(e){console.error(e);busy(false);toast("تعذر تجهيز النسخة")}
}
async function restore(file){
  let data;
  try{data=JSON.parse(await file.text());if(!data||data.app!=="kitchen-rounds")throw new Error("bad")}
  catch(e){toast("الملف غير صالح كنسخة احتياطية");return}
  const n=(data.rounds||[]).length;
  const ok=await confirmSheet("استرجاع "+n+" جولة من النسخة؟ الجولات المكررة تُستبدل بنسختها المحفوظة.","استرجع",false);
  if(!ok)return;
  busy(true,"جارٍ الاسترجاع…");
  try{
    for(const [id,u] of Object.entries(data.photos||{})){await LocalDB.put("photos",id,u);urlCache.set(id,u)}
    for(const r of data.rounds||[]){if(r&&r.id){normRound(r);S.rounds[r.id]=r;await S.store.saveRound(r)}}
    const names=new Set(S.settings.zones.map(z=>z.name.trim()));
    for(const z of (data.settings&&data.settings.zones)||[]){if(z&&z.name&&!names.has(z.name.trim())){S.settings.zones.push(z);names.add(z.name.trim())}}
    saveSettings();busy(false);toast("تم استرجاع النسخة");go({name:"home"});
  }catch(e){console.error(e);busy(false);toast("تعذر إكمال الاسترجاع")}
}

function reportPhotoRound(r){
  const zones=[],obs={};let n=0;
  for(const sec of r.sections){

  const cv=document.createElement("canvas");cv.width=W*K;cv.height=H*K;const ctx=cv.getContext("2d");
  const pdf=new jsPDF({unit:"mm",format:"a4",compress:true});
  pages.forEach((items,pi)=>{
    ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.setTransform(K,0,0,K,0,0);
    items.forEach((it,ii)=>{const nxt=items[ii+1];it.b.draw(ctx,it.y,TOP,!nxt)});
    T(ctx,(pi+1)+" / "+n,W/2,H-28,f(400,11),"#999999","center","ltr");
    if(pi)pdf.addPage();
    pdf.addImage(cv.toDataURL("image/jpeg",0.72),"JPEG",0,0,210,297,undefined,"FAST");
  });
  return pdf.output("blob");
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.closest("#layer"))return;
  const a=el.dataset.act;
  if(a==="home")go({name:"home"});
  else if(a==="settings")go({name:"settings"});
  else if(a==="new-round")sheetNewRound();
  else if(a==="open-round")go({name:"round",id:el.dataset.id});
  else if(a==="open-zone")go({name:isChecklist(S.rounds[S.view.id])?"czone":"zone",id:S.view.id,zoneId:el.dataset.zid});
  else if(a==="back-round")go({name:"round",id:S.view.id});
  else if(a==="round-menu")sheetRoundMenu();
  else if(a==="zone-menu")sheetZoneMenu();
  else if(a==="backup")backup();
  else if(a==="open-section")go({name:"section",id:S.view.id,sid:el.dataset.sid,tab:"check"});
  else if(a==="tab"){S.view.tab=el.dataset.tab;render();window.scrollTo(0,0)}
  else if(a==="pick-area"){S.view.aid=el.dataset.aid;render();window.scrollTo(0,0)}
  else if(a==="filter-area"){S.view.f=el.dataset.aid||"";render()}
  else if(a==="set-val"){const r=S.rounds[S.view.id];const cur=cellVal(r,S.view.sid,S.view.aid,el.dataset.item);setCell(r,S.view.sid,S.view.aid,el.dataset.item,cur===el.dataset.v?"":el.dataset.v);saveRound(r);render()}
  else if(a==="fill-area"||a==="fill-all"){
    const r=S.rounds[S.view.id];const sec=r.sections.find(x=>x.id===S.view.sid);let k=0;
    for(const ar of sec.areas){if(a==="fill-area"&&ar.id!==S.view.aid)continue;for(const it of r.items){if(it.good&&!cellVal(r,sec.id,ar.id,it.id)){setCell(r,sec.id,ar.id,it.id,it.good);k++}}}
    saveRound(r);render();toast(k?"تمت تعبئة "+k+" خانة بالمعتاد، عدّل اللي يختلف":"كل الخانات معبّأة");
  }
  else if(a==="next-area"){const r=S.rounds[S.view.id];const sec=r.sections.find(x=>x.id===S.view.sid);const i=sec.areas.findIndex(x=>x.id===S.view.aid);if(sec.areas[i+1]){S.view.aid=sec.areas[i+1].id;render();window.scrollTo(0,0)}}
  else if(a==="new-note")sheetObs(null);
  else if(a==="edit-note"){const r=S.rounds[S.view.id];const n=(r.notes[S.view.sid]||[]).find(x=>x.id===el.dataset.nid);if(n)sheetObs(n)}
  else if(a==="rsettings")go({name:"rsettings"});
  else if(a==="csettings")go({name:"csettings"});
  else if(a==="pick-day"){S.view.day=+el.dataset.day;S.view.open="";const sx=($("[data-days]")||{}).scrollLeft;render();const st=$("[data-days]");if(st&&sx!=null)st.scrollLeft=sx}
  else if(a==="next-day"){S.view.day=(S.view.day||1)+1;S.view.open="";render();window.scrollTo(0,0);centerDay()}
  else if(a==="mark"){const r=S.rounds[S.view.id];const d=S.view.day;const iid=el.dataset.item;const day=cDay(r,S.view.zoneId,d);const m=day[iid]||{};
    if(m.v===el.dataset.v){if(m.n)delete m.v;else{delete day[iid];m.v=null}}else m.v=el.dataset.v;
    if(m.v||m.n)day[iid]=m;saveRound(r);const sx=($("[data-days]")||{}).scrollLeft;render();const st=$("[data-days]");if(st&&sx!=null)st.scrollLeft=sx;
    if(m.v==="bad"){const inp=$('[data-cnote="'+iid+'"]');if(inp&&!inp.value)inp.focus({preventScroll:true})}}
  else if(a==="all-ok"){const r=S.rounds[S.view.id];const d=S.view.day;const day=cDay(r,S.view.zoneId,d);let k=0;for(const it of r.items){const m=day[it.id]||{};if(!m.v){m.v="ok";day[it.id]=m;k++}}saveRound(r);const sx=($("[data-days]")||{}).scrollLeft;render();const st=$("[data-days]");if(st&&sx!=null)st.scrollLeft=sx;toast(k?"علّمت "+k+" بند بصح، غيّر اللي فيه ملاحظة":"كل البنود معلّمة")}
  else if(a==="note-open"){S.view.open=el.dataset.item;const sx=($("[data-days]")||{}).scrollLeft;render();const st=$("[data-days]");if(st&&sx!=null)st.scrollLeft=sx;const inp=$('[data-cnote="'+el.dataset.item+'"]');if(inp)inp.focus({preventScroll:true})}
  else if(a==="manage-items")sheetManageItems();
  else if(a==="note-for-item"){const r=S.rounds[S.view.id];const it=r.items.find(x=>x.id===el.dataset.item);const v=cellVal(r,S.view.sid,S.view.aid,it.id);sheetObs(null,{text:it.text+" ("+(VL[v]?VL[v].label:"")+"): ",areas:[S.view.aid],level:v==="maint"?"minor":"obs"})}
  else if(a==="rs-add"){
    const root=el.dataset.root||"report";const R=S.settings[root];const path=el.dataset.path;const arr=getPath(R,path);if(!Array.isArray(arr))return;
    if(path==="signers")arr.push({id:uid(),role:"توقيع",name:""});
    else if(path==="items")arr.push(root==="checklist"?{id:uid(),text:"بند جديد"}:{id:uid(),text:"بند جديد",good:"yes"});
    else if(path==="sections")arr.push({id:uid(),name:"قسم جديد",prefix:"ق",color:PALETTE[arr.length%PALETTE.length],areas:[]});
    else arr.push({id:uid(),name:"منطقة جديدة"});
    saveSettings();render();
  }
  else if(a==="rs-del"){
    const R=S.settings[el.dataset.root||"report"];const parts=el.dataset.path.split(".");const idx=+parts.pop();const arr=getPath(R,parts.join("."));if(!Array.isArray(arr))return;
    const what=parts[parts.length-1]==="sections"?"هذا القسم بكل مناطقه":"هذا العنصر";
    confirmSheet("حذف "+what+" من إعدادات التقرير؟","احذف",true).then(ok=>{if(!ok)return;arr.splice(idx,1);saveSettings();render()});
  }
  else if(a==="add-zone-to-round")sheetAddZoneToRound();
  else if(a==="finish")finishRound(S.rounds[S.view.id]);
  else if(a==="export")sheetExport(S.rounds[S.view.id]);
  else if(a==="new-obs")sheetObs(null);
  else if(a==="edit-obs"){const r=S.rounds[S.view.id];const o=(r.obs[S.view.zoneId]||[]).find(x=>x.id===el.dataset.oid);if(o)sheetObs(o)}
  else if(a==="pick-color")sheetColor(el.closest("[data-zid]").dataset.zid);
  else if(a==="del-zone"){
    const zid=el.closest("[data-zid]").dataset.zid;const z=S.settings.zones.find(x=>x.id===zid);
    confirmSheet("حذف منطقة "+z.name+" من القائمة؟ الجولات السابقة لن تتأثر.","احذف",true).then(ok=>{if(!ok)return;S.settings.zones=S.settings.zones.filter(x=>x.id!==zid);saveSettings();render()});
  }
  else if(a==="add-zone"){
    S.settings.zones.push({id:uid(),name:"منطقة جديدة",color:PALETTE[S.settings.zones.length%PALETTE.length]});saveSettings();render();
    const inputs=$$("[data-zname]");const last=inputs[inputs.length-1];if(last){last.focus();last.select()}
  }
});
document.addEventListener("change",e=>{const t=e.target;if(t.tagName==="SELECT"&&t.dataset.rs){setPath(S.settings[t.dataset.root||"report"],t.dataset.rs,t.value);saveSettings();return}if(t.hasAttribute&&t.hasAttribute("data-restore")){const f=t.files&&t.files[0];t.value="";if(f)restore(f)}});
let settingsTimer=null,roundTimer=null;
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.rfield||t.dataset.rsig){
    const r=S.rounds[S.view.id];if(!r)return;
    if(t.dataset.rfield)r[t.dataset.rfield]=t.value;else r.signers[+t.dataset.rsig].name=t.value;
    clearTimeout(roundTimer);roundTimer=setTimeout(()=>saveRound(r),600);return;
  }
  if(t.dataset.cnote){const r=S.rounds[S.view.id];if(!r)return;const d=S.view.day;const day=cDay(r,S.view.zoneId,d);const m=day[t.dataset.cnote]||{};m.n=t.value;if(!m.v&&!m.n)delete day[t.dataset.cnote];else day[t.dataset.cnote]=m;clearTimeout(roundTimer);roundTimer=setTimeout(()=>saveRound(r),600);return}
  if(t.dataset.rs){setPath(S.settings[t.dataset.root||"report"],t.dataset.rs,t.value);clearTimeout(settingsTimer);settingsTimer=setTimeout(saveSettings,600);return}
  if(t.hasAttribute("data-zname")){const z=S.settings.zones.find(x=>x.id===t.closest("[data-zid]").dataset.zid);if(z)z.name=t.value}
  else if(t.dataset.setting){S.settings[t.dataset.setting]=t.value}
  else return;
  clearTimeout(settingsTimer);settingsTimer=setTimeout(()=>{S.settings.zones.forEach(z=>{if(!z.name.trim())z.name="منطقة بدون اسم"});saveSettings()},600);
});

/* ---------- boot ---------- */
(async function boot(){
  try{
    S.store=await pickStore();
    S.memOnly=await LocalDB.isMem();
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    const data=await S.store.load();
    S.settings=data.settings||defaultSettings();
    if(!data.settings)saveSettings();
    S.settings.zones=S.settings.zones||[];
    for(const r of data.rounds){if(r&&r.id){normRound(r);S.rounds[r.id]=r}}
    if(!S.settings.report){S.settings.report=defaultReport(S.settings.inspector);saveSettings()}
    if(!S.settings.checklist){S.settings.checklist=defaultChecklist(S.settings.inspector);saveSettings()}
    render();
  }catch(e){
    console.error(e);
    $("#app").innerHTML='<div class="wrap"><div class="empty" style="margin-top:40px"><p>تعذر تحميل بياناتك. أعد فتح الصفحة.</p></div></div>';
  }
})();
})();
</script>
